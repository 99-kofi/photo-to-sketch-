<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <radialGradient id="smoke" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.55">
        <animate attributeName="stop-color" values="#6d28d9;#8b5cf6;#f472b6;#6d28d9" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="55%" stop-color="#1a1730" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b0d12" />
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6c9ff" />
      <stop offset="1" stop-color="#f472b6" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#0b0d12" />
  <rect width="1080" height="1350" fill="url(#smoke)">
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" additive="sum" dur="18s" repeatCount="indefinite" />
  </rect>

  <!-- drawn sun -->
  <circle cx="540" cy="470" r="150" fill="none" stroke="#d6c9ff" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="943" stroke-dashoffset="943" transform="rotate(-90 540 470)">
    <animate attributeName="stroke-dashoffset" values="943;0" dur="2.4s" begin="0.4s" fill="freeze"
             calcMode="spline" keySplines="0.3 0.6 0.2 1" keyTimes="0;1" />
  </circle>
  <circle cx="540" cy="470" r="150" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.16;0.08" dur="2s" begin="2.6s" fill="freeze" />
    <animate attributeName="r" values="150;158;150" dur="5s" begin="4s" repeatCount="indefinite" />
  </circle>
  <g stroke="#eceaf6" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M120 1180 H560" stroke-dasharray="440" stroke-dashoffset="440">
      <animate attributeName="stroke-dashoffset" values="440;0" dur="1.2s" begin="2.8s" fill="freeze" />
    </path>
    <path d="M640 1180 H960" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0" dur="1s" begin="3.1s" fill="freeze" />
    </path>
    <path d="M180 1230 H760" stroke-dasharray="580" stroke-dashoffset="580">
      <animate attributeName="stroke-dashoffset" values="580;0" dur="1.1s" begin="3.35s" fill="freeze" />
    </path>
  </g>

  <text x="540" y="780" text-anchor="middle" fill="#eceaf6" font-family="Inter, system-ui, sans-serif"
        font-size="96" font-weight="800" letter-spacing="-2" opacity="0">
    Every line,
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.6s" fill="freeze" />
  </text>
  <text x="540" y="900" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="96" font-weight="800" letter-spacing="-2" fill="url(#word)" opacity="0">
    yours alone.
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="2.1s" fill="freeze" />
  </text>

  <text x="540" y="1300" text-anchor="middle" fill="#9a97b8" font-family="Inter, system-ui, sans-serif"
        font-size="34" letter-spacing="10" font-weight="600" opacity="0.9">
    SKETCH STUDIO · FROM WAIT TECHNOLOGIES
  </text>
</svg>
