<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <radialGradient id="ember" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.6;0.4" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0b0d12" />
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="#0b0d12" />
  <rect width="1080" height="1350" fill="url(#ember)" />

  <!-- dying wifi -->
  <g transform="translate(540 430)" fill="none" stroke="#a78bfa" stroke-width="16" stroke-linecap="round">
    <path d="M-150 -80 a 212 212 0 0 1 300 0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.9;0.08;0.08" keyTimes="0;0.3;0.6;1" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M-100 -10 a 141 141 0 0 1 200 0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.9;0.08;0.08" keyTimes="0;0.42;0.7;1" dur="3s" begin="0.35s" repeatCount="indefinite" />
    </path>
    <path d="M-52 62 a 73 73 0 0 1 104 0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.9;0.08;0.08" keyTimes="0;0.55;0.8;1" dur="3s" begin="0.7s" repeatCount="indefinite" />
    </path>
    <circle cx="0" cy="150" r="20" fill="#f472b6" stroke="none">
      <animate attributeName="r" values="20;24;20" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="540" y="800" fill="#eceaf6" font-size="104" font-weight="800" letter-spacing="-2" opacity="0">
      No signal?
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.2s" fill="freeze" />
    </text>
    <text x="540" y="930" fill="#f472b6" font-size="104" font-weight="800" letter-spacing="-2" opacity="0">
      No problem.
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.9s" fill="freeze" />
    </text>
    <text x="540" y="1040" fill="#9a97b8" font-size="42" font-weight="500" opacity="0">
      The engine lives on your device.
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="2.5s" fill="freeze" />
    </text>
  </g>

  <text x="540" y="1300" text-anchor="middle" fill="#9a97b8" font-family="Inter, system-ui, sans-serif"
        font-size="34" letter-spacing="10" font-weight="600">
    SKETCH STUDIO · FROM WAIT TECHNOLOGIES
  </text>
</svg>
